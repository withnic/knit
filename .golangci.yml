# golangci-lint v2 configuration. Run via `make lint`.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errname
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    depguard:
      rules:
        # docs/04_guidelines.md: the tia package must use the standard library only.
        tia-stdlib-only:
          files:
            - "**/internal/tia/**"
          allow:
            - $gostd
            - github.com/withnic/knit
          deny:
            - pkg: golang.org/x/tools
              desc: "tia must depend on the standard library only (go/parser, go/ast, go/token, go/format)"
        # Everything else: no external deps beyond the approved set.
        main:
          files:
            - $all
            - "!**/internal/tia/**"
          allow:
            - $gostd
            - github.com/withnic/knit
            - golang.org/x/tools/go/packages

    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over struct packing
        - shadow

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - whyNoLint

    gosec:
      excludes:
        - G204 # subprocess with variable args is intended (go test / git invocation)

    misspell:
      locale: US

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: redefines-builtin-id

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    paths:
      - testdata
    rules:
      - path: _test\.go
        linters:
          - gosec
          - prealloc
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/withnic/knit
  exclusions:
    generated: lax
    paths:
      - testdata
