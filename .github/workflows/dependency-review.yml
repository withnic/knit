name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities or
# incompatible licenses. knit allows only golang.org/x/tools as an external
# dependency (docs/04_guidelines.md); depguard enforces that in `make lint`.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
