name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities or
# incompatible licenses. knit allows only golang.org/x/tools as an external
# dependency (docs/04_guidelines.md); depguard enforces that in `make lint`.
#
# The result goes to the job summary instead of a PR comment, so the job
# needs no write access and works the same for pull requests from forks
# (whose token is read-only).
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
